# Открытки CC Lab на https://gift.cclab.kz. Сервис подключается к общей сети туннеля cclab-apps,
# в панели туннеля маршрут: gift.cclab.kz -> http://flowers:3000. Секреты лежат в .env.
name: flowers

services:
  flowers:
    build: .
    image: flowers-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - flowers_data:/data
    networks:
      - apps
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  flowers_data:

networks:
  apps:
    external: true
